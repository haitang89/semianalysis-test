benchmark: attention_ragged
regime: ragged
backends: [flash_attn_3]
geometry: {page_size: 784}
timing: {warmup: 10, repeats: 50, graph_mode: always, point_timeout_s: 180}
grid:
  kind: [ragged]
  distribution: [uniform, jitter, lognormal, bimodal, mixed]
  total_tokens: [4096, 16384]
  sequences: [8, 32, 128]
  seed: [7]
extra_grids:
  - {kind: [ragged_decode], distribution: [uniform, jitter, lognormal, bimodal], sequences: [16, 64, 256], mean_kv: [16384], seed: [7]}
