[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen27b-kernel-bench"
version = "0.1.0"
description = "Shape census and attention/GDN kernel benchmarks for Qwen3.8-27B on a single GPU"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Hai Tang" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7.0", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["bench*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
